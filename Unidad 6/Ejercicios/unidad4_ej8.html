<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/Ejercicios/unidad4_ej8.css">
</head>
<body>
<header class="header">  
    <p>ALQUILA AQUI TU COCHE</p>
</header>

<div class="mainContainer">
    <div class="mainNotificacion">
    </div>
</div>

    <script>
        function crearElementos(tipo, clase, type, textContent, src, id, onclick) {
            const nombre = document.createElement(tipo);
            if (clase) nombre.className = (clase);
            if (type) nombre.type = (type);
            if (textContent) nombre.textContent = textContent;
            if (src) nombre.src = (src);
            if (id) nombre.id = (id);
            if (onclick) nombre.onclick = (onclick);
            return nombre;
        }
        function reescribir(elemento, ...nuevos) {
            elemento.innerHTML = "";
            nuevos.forEach(elem => elemento.appendChild(elem));
        }


        const mainContainer = document.querySelector(".mainContainer");
        const mainNotificacion = document.querySelector(".mainNotificacion");

        const botonInicio = crearElementos("button", "boton", null, "Alquilar", null, null, "");
        mainNotificacion.appendChild(botonInicio);
        const parrafoEdad = crearElementos("p", null, null, "Buenos dias, has elegido alquilar un coche, ¿que edad tienes?");
        const inputEdad = crearElementos("input", null, "number");
        const botonContinuar = crearElementos("button", "boton", null, "Ok", null, null, "");
        
        botonInicio.onclick = () => reescribir(mainNotificacion, parrafoEdad, inputEdad, botonContinuar);
        botonContinuar.onclick = () => siguientePaso();

        let edad = 0;
        let paso = 0;
        let inputNombre = null;
        let inputApellido = null;
        let tieneCarnet = null;
        const personas = {};
        function crearUsuario(nombre, apellido, edad, carnet) {
            personas[nombre] = {
                nombre: nombre,
                apellido: apellido,
                edad: edad,
                carnet: carnet
            };
        }

        function siguientePaso() {
            if (paso === 0){
                edad = parseInt(inputEdad.value);
                if (edad < 18){
                    alert("Debes tener al menos 18 años para esto.");
                    return;
                }
                const parrafoCarnet = crearElementos("p", null, null, "¿Tienes carnet de conducir?");
                const botonSi = crearElementos("button", "botonsi", null, "si");
                const botonNo = crearElementos("button", "botonno", null, "no");
                botonSi.onclick = () => {
                    tieneCarnet = true;
                    paso++
                    siguientePaso();
                };
                botonNo.onclick = () => {alert("Lo sentimos no puedes continuar con el proceso si no tienes carnet de conducir.")};
                reescribir(mainNotificacion, parrafoCarnet, botonSi, botonNo);
            }else if (paso === 1){
                const parrafoNombre = crearElementos("p", null, null, "¿cual es tu nombre?");
                inputNombre = crearElementos("input", null, "text");
                const parrafoApellido = crearElementos("p", null, null, "¿Y tu apellido?");
                inputApellido = crearElementos("input", null, "text");
                reescribir(mainNotificacion, parrafoNombre, inputNombre, parrafoApellido, inputApellido, botonContinuar);
            }else if (paso === 2){
                const nombre = inputNombre.value.trim();
                const apellido = inputApellido.value.trim();
                if (!nombre || !apellido){
                    alert("Por favor escribe un nombre y apellido");
                    return;
                }
                crearUsuario(nombre, apellido, edad, tieneCarnet);
                console.log(personas);
                paso++;
            }
        }
    </script>
</body>
</html>
