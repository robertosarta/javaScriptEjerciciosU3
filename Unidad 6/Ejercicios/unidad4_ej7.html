<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="unidad4_ej7.css">
</head>
<body>
    <div class="content"></div>
    <script>
        const content = document.querySelector(".content");

        function crearElementos(tipo, clase, href, textContent) {
            const nombre = document.createElement(tipo);
            if (clase) nombre.className = (clase);
            if (href) nombre.href = (href);
            if (textContent) nombre.textContent = textContent;
            return nombre;
        }
        
        const divHeader = crearElementos("div", "header");
        const aLogo = crearElementos("a", "logo", "#default", "RM");
        const divHeaderRight = crearElementos("div", "header-right");
        const aHome = crearElementos("a", "header-right", "#home", "Home");
        const aContact = crearElementos("a", null, "#contact", "Contact");
        const aAbout = crearElementos("a", null, "#about", "About");

        content.appendChild(divHeader);
        divHeader.appendChild(aLogo);
        divHeader.appendChild(divHeaderRight);
        divHeaderRight.appendChild(aHome);
        divHeaderRight.appendChild(aContact);
        divHeaderRight.appendChild(aAbout);
    </script>
</body>
</html>
