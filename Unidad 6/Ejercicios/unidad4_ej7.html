<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="unidad4_ej7.css">

<body>
    <div class="content"></div>
    
    <script>
        const content = document.querySelector(".content");

        function crearElementos(tipo, clase, href, textContent, src, id) {
            const nombre = document.createElement(tipo);
            if (clase) nombre.className = (clase);
            if (href) nombre.href = (href);
            if (textContent) nombre.textContent = textContent;
            if (src) nombre.src = (src);
            if (id) nombre.id = (id);
            return nombre;
        }
        function crearFoto(nombre, clase, urlImagen, claseImg) {
            const contenedor = document.createElement("div");
            if (clase) contenedor.className = (clase);
            const img = document.createElement("img");
            img.src = urlImagen;
            img.style.width = "100%";

            const nombreTexto = document.createElement("p");
            nombreTexto.textContent = nombre;

            contenedor.appendChild(img);
            contenedor.appendChild(nombreTexto);
            return contenedor;
        }
        //HEADER
        const divHeader = crearElementos("div", "header", null, null, null, "inicio");
        const aLogo = crearElementos("a", "logo", null, "RMR");
        const divHeaderRight = crearElementos("div", "header-right");
        const aHome = crearElementos("a", "header-right", "#home", "Home");
        const aDesigns = crearElementos("a", null, "#designs", "Designs");
        const aContact = crearElementos("a", null, "#contact", "Contact");
        

        content.appendChild(divHeader);
        divHeader.appendChild(aLogo);
        divHeader.appendChild(divHeaderRight);
        divHeaderRight.appendChild(aHome);
        divHeaderRight.appendChild(aDesigns);
        divHeaderRight.appendChild(aContact);
        

        //MAIN 
        const divMain = crearElementos("div","main");
        //HOME
        const divSectionHome = crearElementos("div", null, null, null, null, "home");

        const paragraph = crearElementos("p", null, null, "We are a small studio placed in Sartaguda, Navarra. Our team works mostly on fantasy and mithology designs, we work effortly for you to be satisfied. A close relation with our clients is the priority here, when someone comes her with an special idea we mentor him trough all the styles and posibilities that we can offer to make the perfect artwork that fits like a suit on his skin. Here on our page you can see the available designs that we have at this moment, feel free to explore them and tell us if you like any of them, or maybe you have any idea on editing one just to be more personal, any case welcome to RMR");
        const ourTeamContainer = crearElementos("div", "our-team-container");
        const divisor1 = crearElementos("div", "divisor");
        const subtitle = crearElementos("h3", null, null, "Our team:");
        const divTeamPhotos = crearElementos("div", "team-photos-container");
        const photo1 = crearFoto("Juanito", "photo-block", "https://magazink.inkonsky.com/wp-content/uploads/2024/06/juniorgonzalez.tattoo_1704171435_3271149546263284020_5382354259-819x1024.jpg");
        const photo2 = crearFoto("Bombardiro", "photo-block", "https://voltgallerytattoo.com/wp-content/uploads/2024/02/Richi-VOLT-GALLERY-TATOO.jpg");
        const photo3 = crearFoto("Espinete", "photo-block", "https://cdn0.bodas.net/article-real-wedding/578/3_2/1280/jpg/4866844.jpeg");
        const photo4 = crearFoto("Machiavelo", "photo-block", "https://logiabarcelona.com/wp-content/uploads/2015/11/bangbang2f-1-web.jpg");
        const photo5 = crearFoto("Horus", "photo-block", "https://img.lavdg.com/sc/NnXq3XaQ8Xf5dZLUxnGyUQ8F39c=/1280x/2019/03/20/00121553096282854474391/Foto/P13M9723.jpg");
        const divisor2 = crearElementos("div", "divisor");

        content.appendChild(divMain);
        divMain.appendChild(divSectionHome);

        divSectionHome.appendChild(title);
        divSectionHome.appendChild(paragraph);

        divSectionHome.appendChild(ourTeamContainer);
        ourTeamContainer.appendChild(subtitle);
        ourTeamContainer.appendChild(divisor1);
        ourTeamContainer.appendChild(divTeamPhotos);
        divTeamPhotos.appendChild(photo1);
        divTeamPhotos.appendChild(photo2);
        divTeamPhotos.appendChild(photo3);
        divTeamPhotos.appendChild(photo4);
        divTeamPhotos.appendChild(photo5);

        const col3_img3 = crearElementos("img", null, null, null, "https://i.pinimg.com/736x/87/56/e4/8756e47710441136712e498a3f8e5ce0.jpg");
        const divisor4 = crearElementos("div", "divisor");
        
        divMain.appendChild(contenedorSeccionColumnas);

        col1.appendChild(col1_img1);
        col1.appendChild(col1_img2);
        col1.appendChild(col1_img3);
        divSectionCol.appendChild(col2);
        col2.appendChild(col2_img1);

        col2.appendChild(col2_img3);

        const divisor6 = crearElementos("div", "divisor");

        divMain.appendChild(divSeccionContact);

        //FOOTER
        const footerDiv = crearElementos("div", "footer");
        const footerElement = crearElementos("a",null, "#inicio", "UP");

        divMain.appendChild(footerDiv);

    </script>
